[project]
name = "expense-tracker-api"
version = "0.1.0"
description = "Personal expense and income tracker API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic
